<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a3050">
  <title>Venture Drafters Studio</title>
  <link rel="icon" type="image/svg+xml" href="img/vd-mark-navy-square.svg">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="nav" id="nav" aria-label="Studio sections">
      <a class="nav-brand" href="#/today">
        <img src="img/vd-wordmark-reverse.svg" alt="Venture Drafters" width="150" height="34">
        <span class="nav-brand-sub">Studio</span>
      </a>
      <nav class="nav-list" id="nav-list"></nav>
      <div class="nav-workspace" id="nav-workspace"></div>
      <div class="nav-user" id="nav-user"></div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <div class="topbar-title">
          <span class="eyebrow" id="page-eyebrow">Venture Drafters Studio</span>
          <h1 class="page-title" id="page-title">Today</h1>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <nav class="subnav" id="subnav" aria-label="Content"></nav>
      <div class="outlet" id="outlet"></div>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="Studio sections"></nav>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="dialog-host" id="dialog-host"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
